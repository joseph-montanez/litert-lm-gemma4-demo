<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{title}</title>
<style>
:root {
  /* dark (default) */
  --bg:#0d0d0d; --panel:#1a1a1a; --panel2:#262626;
  --text:#fafafa; --muted:#a3a3a3; --line:#333333;
  --accent:#3b82f6; --user:#1a1a1a; --assistant:#1a1a1a;
  --reasoning-bg:#0d0d0d; --reasoning-text:#d4d4d4;
  --shadow:0 1px 3px rgba(0,0,0,.8);
}
[data-theme="light"] {
  --bg:#ffffff; --panel:#ffffff; --panel2:#f5f5f5;
  --text:#171717; --muted:#737373; --line:#e5e5e5;
  --accent:#2563eb; --user:#eff6ff; --assistant:#ffffff;
  --reasoning-bg:#fafafa; --reasoning-text:#525252;
  --shadow:0 1px 3px rgba(0,0,0,.04);
}
* { box-sizing:border-box; }
*,*::before,*::after { transition:background-color .25s ease,border-color .25s ease,color .15s ease; }
body { margin:0; background:var(--bg); color:var(--text);
  font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
main { height:100vh; display:grid; grid-template-rows:auto 1fr auto; }
header { padding:12px 18px; border-bottom:1px solid var(--line);
  background:var(--panel); display:flex; gap:12px; align-items:center;
  flex-wrap:wrap; box-shadow:var(--shadow); }
header strong { margin-right:auto; }
label { color:var(--muted); font-size:12px; }
select,input,button,textarea { font:inherit; }
select,input { background:var(--panel2); color:var(--text);
  border:1px solid var(--line); border-radius:7px; padding:6px 8px; }
button { background:var(--accent); color:#fff; border:0;
  border-radius:8px; padding:8px 12px; font-weight:650; cursor:pointer; }
button.secondary { background:var(--panel2); color:var(--text);
  border:1px solid var(--line); }
button:disabled { opacity:.5; cursor:not-allowed; }
#themeToggle { background:var(--panel2); color:var(--text);
  border:1px solid var(--line); border-radius:8px; padding:8px 12px;
  font-size:15px; cursor:pointer; line-height:1; }
#messages { overflow:auto; padding:24px max(18px,calc((100vw - 900px)/2));
  display:flex; flex-direction:column; gap:16px; }
.message { border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; white-space:pre-wrap; overflow-wrap:anywhere;
  box-shadow:var(--shadow); }
.user { background:var(--user); align-self:flex-end; max-width:82%; }
.assistant { background:var(--assistant); align-self:stretch; }
.role { color:var(--muted); font-size:12px; text-transform:uppercase;
  letter-spacing:.08em; margin-bottom:6px; }
.reasoning { margin:0 0 12px; border:1px solid var(--line);
  border-radius:8px; background:var(--reasoning-bg); }
.reasoning summary { cursor:pointer; color:var(--muted); padding:8px 10px; }
.reasoning pre { margin:0; padding:0 10px 10px; white-space:pre-wrap;
  color:var(--reasoning-text); font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; }
.metrics { color:var(--muted); font-size:12px; margin-top:10px; }
form { border-top:1px solid var(--line); background:var(--panel);
  padding:12px max(18px,calc((100vw - 900px)/2)); }
.workspace-tools { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  margin-bottom:9px; padding:8px 10px; border:1px solid var(--line);
  border-radius:9px; background:var(--reasoning-bg); }
.workspace-tools label { display:flex; align-items:center; gap:6px; }
.workspace-tools input[type="checkbox"] { width:auto; margin:0; }
#workspacePath { width:min(480px,55vw); }
#workspaceToolSummary { color:var(--muted); font-size:12px; }
textarea { width:100%; resize:vertical; min-height:74px; max-height:240px;
  background:var(--panel2); color:var(--text); border:1px solid var(--line);
  border-radius:10px; padding:11px; }
.actions { display:flex; justify-content:space-between; margin-top:8px; }
#status { color:var(--muted); font-size:12px; }
.empty { color:var(--muted); text-align:center; margin:auto; }

/* modal */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center; z-index:100; }
.overlay.hidden { display:none; }
.modal { background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:24px 28px; max-width:520px; width:94vw;
  max-height:90vh; overflow:auto; box-shadow:0 8px 32px rgba(0,0,0,.35); }
.modal h2 { margin:0 0 6px; font-size:18px; }
.modal .warning { background:var(--reasoning-bg); border:1px solid var(--line);
  border-radius:8px; padding:10px 14px; margin:14px 0;
  color:var(--muted); font-size:13px; display:flex; gap:8px; align-items:flex-start; }
.modal .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
.modal .grid label { display:flex; flex-direction:column; gap:3px; }
.modal .grid input { width:100%; }
.modal .btns { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
#serverStatus { color:var(--muted); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<main>
<header>
  <strong>{title}</strong>
  <label>Model
    <select id="modelSelect">
      <option value="">Loading…</option>
    </select>
  </label>
  <label>Thinking
    <select id="effort">
      <option value="none">None</option>
      <option value="minimal">Minimal</option>
      <option value="low">Low</option>
      <option value="medium">Medium</option>
      <option value="high" selected>High</option>
      <option value="xhigh">Extra high</option>
    </select>
  </label>
  <label>Temperature <input id="temperature" type="number" min="0" max="2"
    step="0.05" value="1.0" style="width:64px"></label>
  <label>Max out <input id="maxTokens" type="number" min="1"
    value="4096" style="width:76px"></label>
  <label>Top-P <input id="topP" type="number" min="0" max="1"
    step="0.05" value="0.95" style="width:64px"></label>
  <label>Top-K <input id="topK" type="number" min="1" max="256"
    step="1" value="64" style="width:64px"></label>
  <label>Seed <input id="seed" type="number" min="0"
    placeholder="auto" style="width:72px"></label>
  <label>Rep.pen <input id="repPenalty" type="number" min="1" max="2"
    step="0.01" value="1.12" style="width:68px"></label>
  <label>Freq.pen <input id="freqPenalty" type="number" min="-2" max="2"
    step="0.1" value="0" style="width:68px"></label>
  <label>Pres.pen <input id="presPenalty" type="number" min="-2" max="2"
    step="0.1" value="0" style="width:68px"></label>
  <button id="themeToggle" type="button" title="Toggle light/dark theme">☀️</button>
  <button id="serverBtn" class="secondary" type="button">⚙️ Server</button>
  <button id="newChat" class="secondary" type="button">New chat</button>
</header>

<section id="messages">
  <div class="empty" id="empty">No tools, MCP, skills, or AGENTS.md are loaded here.</div>
</section>

<form id="composer">
  <div class="workspace-tools">
    <label>
      <input id="workspaceTools" type="checkbox">
      Workspace tools
    </label>
    <label>Folder
      <input id="workspacePath" type="text"
        placeholder="/absolute/path/to/folder" disabled>
    </label>
    <label>
      <input id="workspaceReadOnly" type="checkbox" checked disabled>
      Read only
    </label>
    <span id="workspaceToolSummary">Disabled</span>
  </div>
  <textarea id="prompt" placeholder="Message the local model…" required></textarea>
  <div class="actions">
    <span id="status">Ready</span>
    <div>
      <button id="stop" class="secondary" type="button" disabled>Stop</button>
      <button id="send" type="submit">Send</button>
    </div>
  </div>
</form>
</main>

<div class="overlay hidden" id="serverOverlay">
  <div class="modal">
    <h2>⚙️ Server Settings</h2>
    <div class="warning">
      <span>⚠️</span>
      <span>Changing these settings will <strong>restart the engine</strong> and clear all conversation state. In-flight generations will be cancelled.</span>
    </div>
    <div class="grid" id="serverGrid">
      <!-- populated by JS -->
    </div>
    <span id="serverStatus"></span>
    <div class="btns">
      <button class="secondary" id="serverCancel" type="button">Cancel</button>
      <button id="serverRestart" type="button">Restart Engine</button>
    </div>
  </div>
</div>

<script>
const messages = [];
const list = document.getElementById("messages");
const empty = document.getElementById("empty");
const form = document.getElementById("composer");
const promptBox = document.getElementById("prompt");
const status = document.getElementById("status");
const sendButton = document.getElementById("send");
const stopButton = document.getElementById("stop");
const themeToggle = document.getElementById("themeToggle");
const workspaceTools = document.getElementById("workspaceTools");
const workspacePath = document.getElementById("workspacePath");
const workspaceReadOnly = document.getElementById("workspaceReadOnly");
const workspaceToolSummary = document.getElementById("workspaceToolSummary");
let controller = null;

function updateWorkspaceTools() {
  const enabled = workspaceTools.checked;
  workspacePath.disabled = !enabled;
  workspaceReadOnly.disabled = !enabled;
  workspaceToolSummary.textContent = !enabled
    ? "Disabled"
    : workspaceReadOnly.checked
      ? "list · glob · grep · read · line_count"
      : "list · glob · grep · read · line_count · write";
  empty.textContent = enabled
    ? "Workspace tools are enabled for the selected folder."
    : "No tools, MCP, skills, or AGENTS.md are loaded here.";
  localStorage.setItem("litert-workspace-tools", enabled ? "true" : "false");
  localStorage.setItem("litert-workspace-path", workspacePath.value);
  localStorage.setItem(
    "litert-workspace-read-only",
    workspaceReadOnly.checked ? "true" : "false"
  );
}

workspaceTools.checked =
  localStorage.getItem("litert-workspace-tools") === "true";
workspacePath.value = localStorage.getItem("litert-workspace-path") || "";
workspaceReadOnly.checked =
  localStorage.getItem("litert-workspace-read-only") !== "false";
workspaceTools.addEventListener("change", updateWorkspaceTools);
workspacePath.addEventListener("change", updateWorkspaceTools);
workspaceReadOnly.addEventListener("change", updateWorkspaceTools);
updateWorkspaceTools();

// --- theme ---
function getTheme() {
  const saved = localStorage.getItem("litert-theme");
  if (saved === "light" || saved === "dark") return saved;
  if (window.matchMedia?.("(prefers-color-scheme: light)").matches) return "light";
  return "dark";
}
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  themeToggle.textContent = theme === "light" ? "🌙" : "☀️";
  localStorage.setItem("litert-theme", theme);
}
applyTheme(getTheme());
themeToggle.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next);
});

// --- model selector ---
const modelSelect = document.getElementById("modelSelect");
let switchingModel = false;

async function loadModels() {
  try {
    const resp = await fetch("/v1/admin/models");
    if (!resp.ok) return;
    const data = await resp.json();
    modelSelect.innerHTML = "";
    data.models.forEach(m => {
      const opt = document.createElement("option");
      opt.value = m.key;
      opt.textContent = m.display + (m.downloaded ? "" : " (needs download)");
      if (m.key === data.current) opt.selected = true;
      modelSelect.appendChild(opt);
    });
  } catch (_) {}
}

async function waitForModelReady() {
  try {
    const resp = await fetch("/health");
    if (!resp.ok) throw new Error(resp.statusText);
    const health = await resp.json();

    if (health.status === "loading") {
      status.textContent = "Loading model…";
      sendButton.disabled = true;
      modelSelect.disabled = true;
      setTimeout(waitForModelReady, 1000);
      return;
    }

    if (health.status === "error") {
      status.textContent =
        "Model failed to load: " + (health.model_load_error || "unknown error");
      sendButton.disabled = true;
      modelSelect.disabled = false;
      return;
    }

    if (!controller) status.textContent = "Ready";
    sendButton.disabled = false;
    modelSelect.disabled = false;
    await loadModels();
  } catch (error) {
    status.textContent = "Waiting for server…";
    sendButton.disabled = true;
    modelSelect.disabled = true;
    setTimeout(waitForModelReady, 1000);
  }
}

modelSelect.addEventListener("change", async () => {
  if (switchingModel) return;
  const key = modelSelect.value;
  if (!key) return;

  switchingModel = true;
  modelSelect.disabled = true;
  status.textContent = `Switching model to ${key}…`;

  try {
    const resp = await fetch("/v1/admin/switch-model", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key})
    });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || resp.statusText);
    }
    const result = await resp.json();

    // Reset conversation state on model switch
    messages.length = 0;
    list.replaceChildren(empty);
    empty.style.display = "";
    status.textContent = `Switched to ${result.display}`;

    // Refresh model list to update downloaded status
    await loadModels();
    // Re-select the current model
    modelSelect.value = result.key;
  } catch (e) {
    status.textContent = "Model switch failed: " + e.message;
    await loadModels();
  } finally {
    switchingModel = false;
    modelSelect.disabled = false;
  }
});

// Load models on startup
loadModels();
waitForModelReady();

function addMessage(role, text="") {
  empty.style.display = "none";
  const box = document.createElement("article");
  box.className = `message ${role}`;
  const roleEl = document.createElement("div");
  roleEl.className = "role";
  roleEl.textContent = role;
  const reasoning = document.createElement("details");
  reasoning.className = "reasoning";
  reasoning.open = true;
  reasoning.style.display = "none";
  const summary = document.createElement("summary");
  summary.textContent = "Thinking";
  const reasoningText = document.createElement("pre");
  reasoning.append(summary, reasoningText);
  const content = document.createElement("div");
  content.textContent = text;
  const metrics = document.createElement("div");
  metrics.className = "metrics";
  box.append(roleEl, reasoning, content, metrics);
  list.appendChild(box);
  list.scrollTop = list.scrollHeight;
  return {box, content, reasoning, reasoningText, metrics};
}

function parseEvent(block) {
  const lines = block.split(/\r?\n/);
  const data = lines.filter(x => x.startsWith("data:"))
    .map(x => x.slice(5).trim()).join("\n");
  return data;
}

async function sendMessage(text) {
  const user = {role:"user", content:text};
  messages.push(user);
  addMessage("user", text);
  const assistant = addMessage("assistant");
  controller = new AbortController();
  sendButton.disabled = true;
  stopButton.disabled = false;
  status.textContent = "Generating…";

  const effort = document.getElementById("effort").value;
  const body = {
    model: "local-litert",
    stream: true,
    reasoning_effort: effort,
    include_reasoning: effort !== "none",
    temperature: Number(document.getElementById("temperature").value),
    max_completion_tokens: Number(document.getElementById("maxTokens").value),
    top_p: Number(document.getElementById("topP").value),
    top_k: Number(document.getElementById("topK").value),
    repetition_penalty: Number(document.getElementById("repPenalty").value),
    frequency_penalty: Number(document.getElementById("freqPenalty").value),
    presence_penalty: Number(document.getElementById("presPenalty").value),
    seed: Number(document.getElementById("seed").value) || null,
    workspace_tools: workspaceTools.checked,
    workspace_path: workspacePath.value.trim() || null,
    workspace_read_only: workspaceReadOnly.checked,
    messages
  };

  let answer = "";
  let thinking = "";

  try {
    const response = await fetch("/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body),
      signal:controller.signal
    });

    if (!response.ok) {
      throw new Error(await response.text());
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream:true});

      let boundary;
      while ((boundary = buffer.indexOf("\n\n")) >= 0) {
        const block = buffer.slice(0, boundary);
        buffer = buffer.slice(boundary + 2);
        const data = parseEvent(block);
        if (!data || data === "[DONE]") continue;

        const event = JSON.parse(data);
        if (event.error) throw new Error(event.error.message);

        const delta = event.choices?.[0]?.delta || {};
        if (delta.reasoning_content) {
          thinking += delta.reasoning_content;
          assistant.reasoning.style.display = "";
          assistant.reasoningText.textContent = thinking;
        }
        if (delta.content) {
          answer += delta.content;
          assistant.content.textContent = answer;
        }
        if (event.usage) {
          const u = event.usage;
          const fields = [];
          if (u.time_to_first_token != null)
            fields.push(`TTFT ${u.time_to_first_token.toFixed(2)}s`);
          if (u.prefill_tokens_per_second != null)
            fields.push(`PPS ${u.prefill_tokens_per_second.toFixed(1)}`);
          if (u.decode_tokens_per_second != null)
            fields.push(`TPS ${u.decode_tokens_per_second.toFixed(1)}`);
          if (u.reasoning_tokens != null)
            fields.push(`thinking ${u.reasoning_tokens} tok`);
          assistant.metrics.textContent = fields.join(" · ");
        }
        list.scrollTop = list.scrollHeight;
      }
    }

    if (!answer && !thinking) throw new Error("The model returned no content.");
    messages.push({role:"assistant", content:answer || ""});
    status.textContent = "Ready";
  } catch (error) {
    if (error.name === "AbortError") {
      status.textContent = "Stopped";
    } else {
      assistant.content.textContent = `Error: ${error.message}`;
      status.textContent = "Error";
    }
  } finally {
    controller = null;
    sendButton.disabled = false;
    stopButton.disabled = true;
    promptBox.focus();
  }
}

form.addEventListener("submit", event => {
  event.preventDefault();
  const text = promptBox.value.trim();
  if (!text || controller) return;
  promptBox.value = "";
  sendMessage(text);
});

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});

stopButton.addEventListener("click", () => controller?.abort());

document.getElementById("newChat").addEventListener("click", async () => {
  controller?.abort();
  await fetch("/v1/conversation/reset", {method:"POST"});
  messages.length = 0;
  list.replaceChildren(empty);
  empty.style.display = "";
  status.textContent = "New conversation";
  promptBox.focus();
});

// --- server settings modal ---
const serverFields = [
  {id:"sMaxNumTokens", key:"max_num_tokens", label:"Context window (tokens)", min:2048, type:"number"},
  {id:"sMaxOutTokens", key:"default_max_output_tokens", label:"Default max output tokens", min:64, type:"number"},
  {id:"sToolRespTokens", key:"max_tool_response_tokens", label:"Max tool response tokens", min:64, type:"number"},
  {id:"sSafetyMargin", key:"context_safety_margin_tokens", label:"Safety margin (tokens)", min:64, type:"number"},
  {id:"sTimeout", key:"inference_timeout_seconds", label:"Inference timeout (seconds)", min:10, type:"number"},
  {id:"sTemperature", key:"temperature", label:"Default temperature", min:0, max:2, step:0.05, type:"number"},
  {id:"sTopP", key:"top_p", label:"Default Top-P", min:0, max:1, step:0.05, type:"number"},
  {id:"sTopK", key:"top_k", label:"Default Top-K", min:1, max:256, type:"number"},
  {id:"sReasoning", key:"reasoning_effort", label:"Reasoning effort", type:"select", options:["none","minimal","low","medium","high","xhigh"]},
  {id:"sRepPenalty", key:"repetition_penalty", label:"Repetition penalty", min:1, max:2, step:0.01, type:"number"},
  {id:"sRetries", key:"malformed_tool_call_retries", label:"Tool-call retries", min:0, max:5, type:"number"},
  {id:"sToolArgLength", key:"max_tool_argument_string_length", label:"Max tool argument string length", min:512, type:"number"},
  {id:"sToolCallsPerGen", key:"max_tool_calls_per_generation", label:"Max workspace tool calls per generation", min:1, max:50, type:"number"},
  {id:"sConstrained", key:"constrained_decoding", label:"Constrained decoding", type:"select", options:["true","false"]},
  {id:"sSpecDecoding", key:"speculative_decoding", label:"Speculative decoding", type:"select", options:["true","false"]},
];

const overlay = document.getElementById("serverOverlay");
const serverGrid = document.getElementById("serverGrid");
const serverStatus = document.getElementById("serverStatus");

function buildGrid(config) {
  serverGrid.innerHTML = "";
  serverFields.forEach(f => {
    const label = document.createElement("label");
    label.textContent = f.label;
    let input;
    if (f.type === "select") {
      input = document.createElement("select");
      f.options.forEach(o => {
        const opt = document.createElement("option");
        opt.value = o; opt.textContent = o;
        if (String(config[f.key]) === o) opt.selected = true;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement("input");
      input.type = f.type;
      if (f.min != null) input.min = f.min;
      if (f.max != null) input.max = f.max;
      if (f.step != null) input.step = f.step;
      input.value = config[f.key] ?? "";
    }
    input.id = f.id;
    label.appendChild(input);
    serverGrid.appendChild(label);
  });
}

async function openServerModal() {
  serverStatus.textContent = "Loading current config…";
  overlay.classList.remove("hidden");
  try {
    const resp = await fetch("/v1/admin/config");
    if (!resp.ok) throw new Error(await resp.text());
    const config = await resp.json();
    buildGrid(config);
    serverStatus.textContent = "";
  } catch (e) {
    serverStatus.textContent = "Failed to load: " + e.message;
  }
}

async function loadChatDefaults() {
  try {
    const resp = await fetch("/v1/admin/config");
    if (!resp.ok) return;
    const config = await resp.json();
    if (config.reasoning_effort != null)
      document.getElementById("effort").value = config.reasoning_effort;
    if (config.default_max_output_tokens != null)
      document.getElementById("maxTokens").value = config.default_max_output_tokens;
    if (config.temperature != null)
      document.getElementById("temperature").value = config.temperature;
    if (config.top_p != null)
      document.getElementById("topP").value = config.top_p;
    if (config.top_k != null)
      document.getElementById("topK").value = config.top_k;
    if (config.repetition_penalty != null)
      document.getElementById("repPenalty").value = config.repetition_penalty;
  } catch (_) {}
}

function closeServerModal() {
  overlay.classList.add("hidden");
}

document.getElementById("serverBtn").addEventListener("click", openServerModal);
document.getElementById("serverCancel").addEventListener("click", closeServerModal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeServerModal(); });

document.getElementById("serverRestart").addEventListener("click", async () => {
  const body = {};
  serverFields.forEach(f => {
    const el = document.getElementById(f.id);
    if (!el) return;
    let val = el.value;
    if (f.type === "number") {
      val = val === "" ? null : Number(val);
    } else if (f.key === "constrained_decoding" || f.key === "speculative_decoding") {
      val = val === "true";
    }
    body[f.key] = val;
  });

  serverStatus.textContent = "Restarting engine…";
  document.getElementById("serverRestart").disabled = true;
  try {
    const resp = await fetch("/v1/admin/reconfigure", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(body)
    });
    if (!resp.ok) throw new Error(await resp.text());
    const result = await resp.json();
    serverStatus.textContent = "Done. " + result.changes.join(", ");
    // Refresh the displayed config
    const cfg = await fetch("/v1/admin/config").then(r => r.json());
    buildGrid(cfg);
    loadChatDefaults();
  } catch (e) {
    serverStatus.textContent = "Error: " + e.message;
  } finally {
    document.getElementById("serverRestart").disabled = false;
  }
});

loadChatDefaults();
</script>
</body>
</html>
